services:
  db:
    image: postgres:16
    container_name: lang-db
    restart: always
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-api
    restart: always
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - db

volumes:
  db_data:
